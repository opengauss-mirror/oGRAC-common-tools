title = "secretscan huawei rules"

# 在 gitleaks 官方默认规则之上追加，不替换
[extend]
useDefault = true

# 华为云 AK：20 位大写字母数字，上下文里出现 ak / access_key 等字样
# (?i:...) 只作用于关键字，值本身必须区分大小写，否则 validateObsAccessKey
# 这类驼峰标识符会被误当成 AK
[[rules]]
id = "huawei-cloud-ak"
description = "Huawei Cloud AK with context"
regex = '''(?i:(?:ak|access[_-]?key))\s*[:=]\s*["']?([A-Z0-9]{20})["']?'''
entropy = 3.0
keywords = ["ak", "access_key", "obs", "myhuaweicloud", "hwclouds"]

# 华为云 SK：40 位，必须与 AK 同文件出现才采纳（程序里做了配对检查）
[[rules]]
id = "huawei-cloud-sk"
description = "Huawei Cloud SK with context"
regex = '''(?i:(?:sk|secret[_-]?key))\s*[:=]\s*["']?([A-Za-z0-9]{40})["']?'''
entropy = 3.5
keywords = ["sk", "secret_key", "obs", "myhuaweicloud", "hwclouds"]

# 华为内网域名
[[rules]]
id = "huawei-internal-host"
description = "Huawei internal hostname"
regex = '''\b(?:w3|3ms|mail|w3m|eim|w3test)\.huawei\.com\b'''

# 华为密级标记
[[rules]]
id = "huawei-confidential"
description = "Huawei confidential marker"
regex = '''(?i)(huawei\s+confidential|华为机密|内部公开|仅供内部使用)'''

# GitCode / Gitee 个人访问令牌：赋值，或写在克隆 URL 的用户信息里
[[rules]]
id = "gitcode-gitee-token"
description = "GitCode or Gitee personal access token"
regex = '''(?i)(?:(?:https?://[^\s'"]{0,80})?(?:gitcode\.com|gitee\.com)[^\n]{0,80}?)?(?:private[_-]?token|access[_-]?token|oauth2)\s*[:=]\s*['"]?([A-Za-z0-9_\-]{20,128})'''
entropy = 3.2
keywords = ["gitcode", "gitee", "private_token", "access_token", "oauth2"]
[[rules.allowlists]]
regexTarget = "match"
regexes = ['''(?i)(example|placeholder|changeme|your[_-]?token|x{4,}|<[^>]+>|\$\{)''']

# 克隆 URL 中的令牌：https://oauth2:<token>@gitcode.com 或 gitee.com
[[rules]]
id = "gitcode-gitee-url-token"
description = "Token embedded in a GitCode or Gitee clone URL"
regex = '''(?i)https://[^:\s'"]+:([A-Za-z0-9_\-]{20,128})@(?:gitcode\.com|gitee\.com)\b'''
entropy = 3.2
keywords = ["gitcode.com", "gitee.com"]
[[rules.allowlists]]
regexTarget = "match"
regexes = ['''(?i)(example|placeholder|changeme|your[_-]?token|x{4,}|<[^>]+>|\$\{)''']

# DeepSeek / 百炼 / Kimi / 硅基流动等使用 sk- 前缀、且不是 OpenAI 旧格式的密钥
[[rules]]
id = "llm-sk-api-key"
description = "LLM API key with sk- prefix"
regex = '''\b(sk-[A-Za-z0-9_\-]{20,200})\b'''
entropy = 3.5
keywords = ["sk-"]
[[rules.allowlists]]
regexTarget = "match"
regexes = ['''(?i)(example|placeholder|changeme|your[_-]?key|x{4,}|<[^>]+>|\$\{|T3BlbkFJ)''']
